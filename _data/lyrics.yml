# _data/lyrics.yml
- text: 우리의 진정한 자아는 오롯이 우리 안에 있지 않다.
  artist: "[장 자크 루소]"

- text: 그래서, 좋은 독서는 신비스럽게도 이중적인 성격을 갖고 있습니다.<br>길을 찾게도 만들고 마음껏 헤매게도 만듭니다.<br>그리고, 세계 앞에 홀로 서게 만듭니다.
  artist: "[이동진] <b>이동진 독서법</b> 中"

- text: 우리의 작은 우주는, 우리가 읽은 책들로 이루어져 있다
  artist: "[김영하] <b>읽다</b> 中"

- text: 삶에 대한 절망 없이는 삶에 대한 사랑은 없다.
  artist: "[알베르 카뮈] <b>안과 겉, 결혼, 여름</b> 中"

- text: 오늘 엄마가 죽었다. 아니, 어쩌면 어제인지도 모르겠다.
  artist: "[알베르 카뮈] <b>이방인</b> 中"

- text: 한 권의 책은 우리 내면의 얼어붙은 바다를 깨부수는 도끼여야 한다
  artist: "[프란츠 카프카(Franz Kafka)] <b>오스카 폴락에게 보낸 편지</b> 中"

- text: 인간은 파괴될 수 있지만 패배할 수는 없다.
  artist: "[어니스트 헤밍웨이(Ernest Hemingway)] <b>노인과 바다</b> 中"
